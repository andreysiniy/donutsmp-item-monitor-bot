[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "donutsmp-discord-bot"
version = "1.0.0"
description = "Discord bot for DonutSMP auction price monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.29,<1",
    "cryptography>=42,<46",
    "discord.py>=2.4,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0.31,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
]

[project.scripts]
donutsmp-bot = "donutsmp_bot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/donutsmp_bot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["donutsmp_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "ASYNC110", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

